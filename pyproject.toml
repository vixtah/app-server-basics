[project]
name = "app-server-basics"
version = "0.3.0"
description = "Server plumbing shared by the apps: heartbeats, auth, SQLite helpers and polite outside-API calls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["orbit-jobs>=0.2.4"]

[project.optional-dependencies]
# app_server_basics.heartbeats.heartbeats_router (the FastAPI route) and
# app_server_basics.auth.require_token / require_owner (FastAPI dependencies).
fastapi = ["fastapi>=0.115"]

[dependency-groups]
dev = ["app-server-basics[fastapi]", "pytest>=8", "httpx>=0.27", "uvicorn>=0.30"]

[tool.uv.sources]
orbit-jobs = { git = "https://github.com/vixtah/orbit-jobs", tag = "v0.2.4" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_server_basics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
